name: Preview

# Every pull request gets its own preview link, posted as a comment on the PR.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Preview deployment
    # Pull requests from forks can't use the repository's secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy preview
        id: deploy
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: pages deploy --branch ${{ github.head_ref }} --commit-dirty=true

      - name: Post preview link
        if: env.HAS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          COMMIT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          body="**Preview:** ${ALIAS_URL:-$COMMIT_URL}

          This exact commit (${GITHUB_SHA::7}): $COMMIT_URL"
          gh pr comment "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body "$body"

      - name: Skip (no Cloudflare token yet)
        if: env.HAS_TOKEN != 'true'
        run: echo "CLOUDFLARE_API_TOKEN isn't set in the repository's Actions secrets, so no preview was deployed."
