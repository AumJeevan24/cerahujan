name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The app isn't scaffolded yet. Until package.json exists, the job
      # passes without running anything so repo-setup PRs can merge.
      - name: Check for package.json
        id: pkg
        run: |
          if [ -f package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; echo "No package.json yet, skipping."; fi

      - uses: actions/setup-node@v4
        if: steps.pkg.outputs.exists == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.pkg.outputs.exists == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.pkg.outputs.exists == 'true'
        run: npm run typecheck

      - name: Test
        if: steps.pkg.outputs.exists == 'true'
        run: npm test

      - name: Build
        if: steps.pkg.outputs.exists == 'true'
        run: npm run build
